name: CHAT07 Python Infrastructure Tests

on:
  push:
    paths:
      - "prototype/**"
      - ".github/workflows/chat07-python-tests.yml"
  pull_request:
    paths:
      - "prototype/**"
      - ".github/workflows/chat07-python-tests.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: ./tests/run_unit_tests.sh
